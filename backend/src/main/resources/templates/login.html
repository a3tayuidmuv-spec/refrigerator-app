<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ログイン</title>
</head>

<body>

<h1>ポータブル冷蔵庫</h1>
<h2>ログイン</h2>

<form action="/login" method="post">

    <label>ログインID：</label>
    <input type="text" name="loginId" required>

    <br><br>

    <label>パスワード：</label>
    <input type="password" name="password" required>

    <br><br>

    <button type="submit">ログイン</button>

</form>

<br>

<p th:if="${message}" th:text="${message}"></p>

</body>
</html>
